   <g id="node-label:input">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(31.566542 103.291964)">Test stream x_t</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(24.100277 110.373577)">one image at a time</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(40.682042 117.45519)">no labels</text>
   </g>
   <g id="node-label:vlm">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(133.946 91.018211)">VLM</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(113.718 98.699961)">image tower: e_t</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(105.16 106.381711)">text tower (cached): T</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(102.6105 114.063461)">p_t = softmax(e_tᵀT / τ)</text>
   </g>
   <g id="node-detail:vlm">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64717a" x="140.679" y="125.713445" transform="rotate(-0 140.679 125.713445)">frozen</text>
   </g>
   <g id="node-label:smcm">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(227.2019 62.702765)">Softmax score (MCM)</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(222.5614 70.384015)">S_MCM = − max_c p_t,c</text>
   </g>
   <g id="node-label:bank">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(225.5489 109.45748)">Online prototype bank</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(219.4539 117.13923)">per-class FIFO queues D_c</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(220.4839 124.82098)">of at most M embeddings</text>
   </g>
   <g id="node-label:proto">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(216.673993 161.549561)">1  Domain-anchored prototypes</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(206.276805 168.271093)">μ_dom: mean-shift mode of all queues</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(241.595743 174.992186)">μ_c ∝ Σ_e w(e) e</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(222.066618 181.713718)">w(e) = exp((e·μ_dom − 1)/h)</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(222.768805 188.434811)">S_proto = 1 − max_c e_t·μ_c</text>
   </g>
   <g id="node-label:admit">
    <text style="font-weight: 700; font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(97.539302 168.358908)">2  Consistency admission</text>
    <text style="font-weight: 700; font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(108.405442 175.676521)">admit e_t to D_ĉ iff</text>
    <text style="font-weight: 700; font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(106.658489 182.758134)">max_c p_t,c ≥ γ and</text>
    <text style="font-weight: 700; font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(89.230903 190.075748)">d_t = 1 − e_t·μ_ĉ ≤ m_t + κ s_t</text>
   </g>
   <g id="node-label:fuse">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(362.453525 85.283868)">3  Scale-free adaptive fusion</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(343.016713 92.004962)">S_t = α_t z(S_MCM) + (1 − α_t) z(S_proto)</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(348.583462 98.726493)">z: online z-score, α_t: variance-driven</text>
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #17232b" transform="translate(353.21265 105.448024)">before calibration: S_t = z(S_MCM)</text>
   </g>
